name: Generate WeChat RSS

on:
  schedule:
    - cron: '0 3 * * *'   # 每天 UTC 3 点
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'wechat_feeds.txt'
      - '.github/workflows/wechat-rss.yml'
  pull_request:
    paths:
      - 'wechat_feeds.txt'
      - '.github/workflows/wechat-rss.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Start local RSSHub if needed
        run: |
          set -euo pipefail

          if ! grep -Eq '^[^#][^,]*,rsshub-local:' wechat_feeds.txt; then
            echo "No local RSSHub source configured."
            exit 0
          fi

          docker run -d --name rsshub -p 1200:1200 diygod/rsshub

          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:1200/ >/dev/null; then
              echo "RSSHub is ready."
              exit 0
            fi
            sleep 2
          done

          docker logs rsshub || true
          echo "ERROR: RSSHub failed to start."
          exit 1

      - name: Fetch WeChat feeds
        run: |
          set -euo pipefail

          if [ ! -f wechat_feeds.txt ]; then
            echo "ERROR: wechat_feeds.txt not found in repo root."
            exit 1
          fi

          mkdir -p docs/feeds
          echo "==== Start fetching feeds ===="

          while IFS=',' read -r slug source_url author_filter; do
            slug="$(echo "$slug" | xargs)"
            source_url="$(echo "$source_url" | xargs)"
            author_filter="$(echo "${author_filter:-}" | xargs)"

            if [ -z "$slug" ] || [[ "$slug" =~ ^# ]]; then
              continue
            fi

            if [ -z "$source_url" ]; then
              echo "ERROR: source URL is missing for '$slug'."
              exit 1
            fi

            case "$source_url" in
              rsshub-local:/*)
                source_url="http://127.0.0.1:1200${source_url#rsshub-local:}"
                ;;
              http://*|https://*) ;;
              *)
                echo "ERROR: invalid source URL for '$slug': $source_url"
                exit 1
                ;;
            esac

            target="docs/feeds/${slug}.xml"
            temp="${target}.tmp"

            echo "Fetching '$slug' from '$source_url' ..."
            rm -f "$temp"

            curl -fL --retry 3 --retry-all-errors \
              --connect-timeout 10 --max-time 120 \
              -sS "$source_url" -o "$temp"

            if [ ! -s "$temp" ]; then
              echo "ERROR: fetched feed for '$slug' is empty."
              rm -f "$temp"
              exit 1
            fi

            if ! grep -Eq '<rss([[:space:]>])|<feed([[:space:]>])' "$temp"; then
              echo "ERROR: fetched content for '$slug' is not RSS/Atom."
              head -c 500 "$temp" || true
              echo
              rm -f "$temp"
              exit 1
            fi

            if ! grep -Eq '<item([[:space:]>])|<entry([[:space:]>])' "$temp"; then
              echo "ERROR: fetched feed for '$slug' contains no entries."
              rm -f "$temp"
              exit 1
            fi

            if [ -n "$author_filter" ]; then
              python3 - "$temp" "$author_filter" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          path, expected_author = sys.argv[1], sys.argv[2]
          ET.register_namespace('atom', 'http://www.w3.org/2005/Atom')
          tree = ET.parse(path)
          root = tree.getroot()
          channel = root.find('channel')
          if channel is None:
              raise SystemExit('ERROR: author filtering currently requires RSS 2.0')

          items = channel.findall('item')
          matched = 0
          for item in items:
              author = (item.findtext('author') or '').strip()
              if author == expected_author:
                  matched += 1
              else:
                  channel.remove(item)

          if matched == 0:
              raise SystemExit(f"ERROR: no entries matched author '{expected_author}'")

          tree.write(path, encoding='utf-8', xml_declaration=True)
          print(f"Kept {matched}/{len(items)} entries for author '{expected_author}'")
          PY
            fi

            mv "$temp" "$target"
            echo "Updated $target"
          done < wechat_feeds.txt

          echo "==== files in docs/feeds ===="
          ls -lh docs/feeds

      - name: Stop local RSSHub
        if: always()
        run: docker rm -f rsshub >/dev/null 2>&1 || true

      - name: Generate OPML
        run: |
          set -euo pipefail

          REPO_NAME=$(basename "$GITHUB_REPOSITORY")
          BASE_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}"
          OPML_FILE="docs/wechat.opml"

          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<opml version="2.0">'
            echo '  <head>'
            echo '    <title>WeChat Subscriptions</title>'
            echo "    <dateCreated>$(date -u +'%Y-%m-%dT%H:%M:%SZ')</dateCreated>"
            echo '  </head>'
            echo '  <body>'

            while IFS=',' read -r slug source_url author_filter; do
              slug="$(echo "$slug" | xargs)"

              if [ -z "$slug" ] || [[ "$slug" =~ ^# ]]; then
                continue
              fi

              FEED_URL="${BASE_URL}/feeds/${slug}.xml"
              echo "    <outline text=\"${slug}\" title=\"${slug}\" type=\"rss\" xmlUrl=\"${FEED_URL}\" />"
            done < wechat_feeds.txt

            echo '  </body>'
            echo '</opml>'
          } > "$OPML_FILE"

      - name: Commit and push changes
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update WeChat RSS feeds"
          git push
